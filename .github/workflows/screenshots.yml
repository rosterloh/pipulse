name: Screenshots

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # PRs can only restore caches from their own branch or the base branch, so
  # build on main to give every new PR a warm cache.
  warm-cache:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-screenshots-${{ hashFiles('Cargo.lock') }}

      - name: Install SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev

      - name: Build
        run: cargo build --no-default-features --features sim,ci

  screenshots:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      # Shared by both checkouts so common dependencies are only compiled once
      CARGO_TARGET_DIR: ${{ github.workspace }}/target

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: before

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: after

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-screenshots-${{ hashFiles('before/Cargo.lock', 'after/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-screenshots-

      - name: Install SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev

      - name: Before screenshot
        working-directory: before
        env:
          SDL_VIDEODRIVER: dummy
        run: EG_SIMULATOR_DUMP=/tmp/before.png cargo run --no-default-features --features sim,ci

      - name: After screenshot
        working-directory: after
        env:
          SDL_VIDEODRIVER: dummy
        run: EG_SIMULATOR_DUMP=/tmp/after.png cargo run --no-default-features --features sim,ci

      # Uploaded unzipped so each link opens the PNG directly
      - name: Upload before screenshot
        id: upload-before
        uses: actions/upload-artifact@v7
        with:
          path: /tmp/before.png
          archive: false

      - name: Upload after screenshot
        id: upload-after
        uses: actions/upload-artifact@v7
        with:
          path: /tmp/after.png
          archive: false

      - name: Post PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "## Display Preview

          [Before](${{ steps.upload-before.outputs.artifact-url }}) · [After](${{ steps.upload-after.outputs.artifact-url }})"
