name: Screenshots

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  screenshots:
    runs-on: ubuntu-latest
    permissions:
      # write: screenshots are pushed to the `screenshots` branch so the
      # PR comment can embed them (artifacts are zipped and need a login)
      contents: write
      pull-requests: write
    env:
      # Shared by both checkouts so common dependencies are only compiled once
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: before

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: after

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-screenshots-${{ hashFiles('before/Cargo.lock', 'after/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-screenshots-

      - name: Install SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev

      - name: Before screenshot
        working-directory: before
        env:
          SDL_VIDEODRIVER: dummy
        run: EG_SIMULATOR_DUMP=/tmp/before.png cargo run --no-default-features --features sim,ci

      - name: After screenshot
        working-directory: after
        env:
          SDL_VIDEODRIVER: dummy
        run: EG_SIMULATOR_DUMP=/tmp/after.png cargo run --no-default-features --features sim,ci

      - name: Upload screenshots
        id: upload-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: /tmp/*.png

      - name: Publish screenshots
        id: publish
        # Fork PRs get a read-only token; they still get the artifact
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          SHOT_DIR: pr-${{ github.event.pull_request.number }}/${{ github.event.pull_request.head.sha }}
        run: |
          git init -q /tmp/shots && cd /tmp/shots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin screenshots; then
            git checkout -q -b screenshots FETCH_HEAD
          else
            git checkout -q --orphan screenshots
          fi
          mkdir -p "$SHOT_DIR"
          cp /tmp/before.png /tmp/after.png "$SHOT_DIR/"
          git add "$SHOT_DIR"
          git commit -q -m "Screenshots for $SHOT_DIR"
          # Retry in case another PR pushed to the branch concurrently
          for i in 1 2 3; do
            git push -q origin screenshots && pushed=1 && break
            git pull -q --rebase origin screenshots
          done
          [ -n "$pushed" ]
          echo "base=https://raw.githubusercontent.com/${{ github.repository }}/screenshots/$SHOT_DIR" >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.publish.outputs.base }}
          ARTIFACT: ${{ steps.upload-artifacts.outputs.artifact-url }}
        run: |
          if [ -n "$BASE" ]; then
            table="| Before | After |
          |--------|-------|
          | ![Before Screenshot]($BASE/before.png) | ![After Screenshot]($BASE/after.png) |"
          else
            table="Screenshots are in the [workflow artifact]($ARTIFACT)."
          fi
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "## Display Preview

          $table"
