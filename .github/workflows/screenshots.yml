name: Screenshots

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      # Shared by both checkouts so common dependencies are only compiled once
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: before

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: after

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-screenshots-${{ hashFiles('before/Cargo.lock', 'after/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-screenshots-

      - name: Install SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev

      - name: Before screenshot
        working-directory: before
        env:
          SDL_VIDEODRIVER: dummy
        run: EG_SIMULATOR_DUMP=/tmp/before.png cargo run --no-default-features --features sim,ci

      - name: After screenshot
        working-directory: after
        env:
          SDL_VIDEODRIVER: dummy
        run: EG_SIMULATOR_DUMP=/tmp/after.png cargo run --no-default-features --features sim,ci

      - name: Upload screenshots
        id: upload-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: /tmp/*.png

      - name: Post PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "## Display Preview

          | Before | After |
          |--------|-------|
          | ![Before Screenshot](${{ steps.upload-artifacts.outputs.artifact-url }}/before.png) | ![After Screenshot](${{ steps.upload-artifacts.outputs.artifact-url }}/after.png) |"