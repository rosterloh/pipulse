[package]
name = "pipulse"
version = "1.1.0"
edition = "2024"
description = "Raspberry Pi system status display for the Adafruit miniPiTFT"

[package.metadata.deb]
copyright = "pipulse contributors"
section = "utils"
priority = "optional"
maintainer-scripts = "debian"
assets = [
    ["target/release/pipulse", "usr/local/bin/pipulse", "755"],
]

[package.metadata.deb.systemd-units]
unit-scripts = "scripts"
enable = true
start = true

[features]
default = ["hw"]
hw  = ["dep:embedded-hal", "dep:linux-embedded-hal", "dep:mipidsi"]
sim = ["dep:embedded-graphics-simulator"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
embedded-graphics = "0.8.2"
embedded-graphics-simulator = { version = "0.8.0", optional = true }
embedded-hal = { version = "1.0.0", optional = true }
embedded-icon = { version = "0.0.1", default-features = false, features = ["18px", "mdi"] }
linux-embedded-hal = { version = "0.5.0", optional = true, default-features = false, features = ["gpio_cdev", "spi"] }
mipidsi = { version = "0.10.0", optional = true }
mousefood = { version = "0.5.3", default-features = false, features = ["fonts"] }
ratatui = { version = "0.30.2", default-features = false }
sysinfo = { version = "0.39.6", default-features = false, features = ["component", "disk", "network", "system"] }
thiserror = "2.0.21"

[profile.release]
lto = true
codegen-units = 1
strip = true
